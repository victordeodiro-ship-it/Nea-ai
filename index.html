
<script>
const $ = id => document.getElementById(id);
const API_URL = 'https://nea-ai.vercel.app/api/chat';

let history = [];

try {
  history = JSON.parse(localStorage.getItem('nea_history') || '[]');
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

let busy = false;

function saveHistory() {
  localStorage.setItem('nea_history', JSON.stringify(history));
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const target = $('tab-' + name);
  if (target) target.classList.add('active');
  closeSidebar();
  if (name === 'conversas') renderHistoryList();
  window.scrollTo(0, 0);
}

function openSidebar() {
  $('sidebar').classList.add('open');
  $('overlay').classList.add('open');
}

function closeSidebar() {
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('open');
}

$('openMenu').addEventListener('click', openSidebar);
$('closeMenu').addEventListener('click', closeSidebar);
$('overlay').addEventListener('click', closeSidebar);

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

  if (role !== 'user') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'N';
    wrap.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  $('chat').appendChild(wrap);
  $('chat').scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderChat() {
  $('chat').replaceChildren();
  history.forEach(m => addBubble(m.role, m.text));
}

function renderHistoryList() {
  const list = $('historyList');
  list.replaceChildren();

  if (!history.length) {
    list.textContent = 'Você ainda não tem mensagens salvas.';
    return;
  }

  history.slice(-30).reverse().forEach(m => {
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = (m.role === 'user' ? 'Você: ' : 'Nea: ') + m.text;
    list.appendChild(p);
  });
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || busy) return;

  busy = true;
  $('sendBtn').disabled = true;
  $('status').textContent = 'Nea está pensando…';

  history.push({ role: 'user', text });
  saveHistory();
  addBubble('user', text);
  $('messageInput').value = '';

  const typing = document.createElement('p');
  typing.className = 'muted';
  typing.textContent = 'Nea está pensando…';
  $('chat').appendChild(typing);

  try {
    const messages = history.slice(-20).map(m => ({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content: m.text
    }));

    const memory = localStorage.getItem('nea_memory') || '';

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, memory })
    });

    let data = {};
    try {
      data = await response.json();
    } catch {}

    if (!response.ok) {
      throw new Error(data.error || ('Erro HTTP ' + response.status));
    }

    const answer = data.answer || data.response || data.message;

    if (typeof answer !== 'string' || !answer.trim()) {
      throw new Error('O servidor não retornou uma resposta reconhecida.');
    }

    typing.remove();
    history.push({ role: 'assistant', text: answer });
    saveHistory();
    addBubble('assistant', answer);
  } catch (err) {
    typing.remove();
    console.error('Erro da Nea:', err);

    addBubble(
      'assistant',
      'Não consegui conectar ao servidor agora. Verifique a Vercel e tente novamente.'
    );
  } finally {
    busy = false;
    $('sendBtn').disabled = false;
    $('status').textContent = 'Pronta para conversar';
    renderHistoryList();
  }
}

$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  sendMessage($('messageInput').value);
});

$('messageInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    $('chatForm').requestSubmit();
  }
});

function suggest(text) {
  showTab('inicio');
  $('messageInput').value = text;
  $('messageInput').focus();
}

function newChat() {
  history = [];
  saveHistory();
  $('chat').replaceChildren();
  $('messageInput').value = '';
  showTab('inicio');
}

function saveMemory() {
  localStorage.setItem('nea_memory', $('memoryInput').value.trim());
  $('memoryStatus').textContent = 'Memória salva neste aparelho.';
}

function clearMemory() {
  if (confirm('Apagar a memória salva neste aparelho?')) {
    localStorage.removeItem('nea_memory');
    $('memoryInput').value = '';
    $('memoryStatus').textContent = 'Memória apagada.';
  }
}

function clearHistory() {
  if (confirm('Apagar todas as mensagens salvas neste aparelho?')) {
    history = [];
    saveHistory();
    renderChat();
    renderHistoryList();
  }
}

function saveSettings() {
  localStorage.setItem(
    'nea_name',
    $('assistantName').value.trim() || 'Nea'
  );

  localStorage.setItem('nea_personality', $('personality').value);
  alert('Preferências salvas na Nea IA! 💙');
}

async function prepareMedia() {
  const prompt = $('mediaPrompt').value.trim();
  const tipo = $('mediaType').value.toLowerCase();
  const status = $('mediaStatus');

  if (!prompt) {
    status.textContent = 'Escreva uma descrição primeiro.';
    return;
  }

  if (tipo === 'vídeo') {
    status.textContent =
      'A geração de vídeos ainda será conectada. Vamos testar as imagens primeiro.';
    return;
  }

  let resultado = $('mediaResult');

  if (!resultado) {
    resultado = document.createElement('div');
    resultado.id = 'mediaResult';
    status.insertAdjacentElement('afterend', resultado);
  }

  resultado.replaceChildren();
  status.textContent = 'A Nea está tentando criar sua imagem…';

  try {
    const response = await fetch(
      'https://nea-ai.vercel.app/api/image',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      }
    );

    let data = {};

    try {
      data = await response.json();
    } catch {}

    if (!response.ok) {
      throw new Error(
        data.error || 'O serviço não conseguiu gerar a imagem.'
      );
    }

    if (typeof data.image !== 'string' || !data.image) {
      throw new Error('A API não retornou uma imagem válida.');
    }

    const imagem = document.createElement('img');
    imagem.src = data.image;
    imagem.alt = prompt;
    imagem.style.maxWidth = '100%';
    imagem.style.height = 'auto';
    imagem.style.borderRadius = '12px';
    imagem.style.marginTop = '12px';

    resultado.appendChild(imagem);
    status.textContent = 'Imagem criada pela Nea! 💙';
  } catch (erro) {
    console.error('Erro ao gerar imagem:', erro);
    status.textContent = 'Não consegui gerar a imagem: ' + erro.message;
  }
}

$('memoryInput').value = localStorage.getItem('nea_memory') || '';
$('assistantName').value = localStorage.getItem('nea_name') || 'Nea';
$('personality').value =
  localStorage.getItem('nea_personality') ||
  'Equilibrada, divertida e acolhedora';

renderChat();
renderHistoryList();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
